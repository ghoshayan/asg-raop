name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Presubmit & Invariant Matrix (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate offline fixtures (hermetic verification)
        run: python tests/fixtures/generate_elpv_samples.py

      - name: Run Google-SWE presubmit gate
        run: python scripts/presubmit.py

      - name: Invariant test suite
        run: pytest -v --tb=short

      - name: End-to-end pipeline smoke test
        run: python pipeline.py --mode fixture --topology example-mv --no-copilot --no-n1
